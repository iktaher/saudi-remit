name: hourly-rates
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m venv .venv && .venv/bin/pip install playwright && .venv/bin/python -m playwright install --with-deps chromium
      # Alerts are handled by the box's local Telegram bot (subscriber list lives there).
      # The workflow never gets the token, so it cannot send alerts or touch subscribers.
      - run: ./run.sh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          AFF_WISE_URL: ${{ vars.AFF_WISE_URL }}
          AFF_REMITLY_URL: ${{ vars.AFF_REMITLY_URL }}
          AFF_WORLDREMIT_URL: ${{ vars.AFF_WORLDREMIT_URL }}
          AFF_INSTAREM_URL: ${{ vars.AFF_INSTAREM_URL }}
          AFF_WU_URL: ${{ vars.AFF_WU_URL }}
          DISABLE_ALERTS: "1"
      - name: IndexNow ping (non-fatal)
        run: python3 src/indexnow.py || true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
